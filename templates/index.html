<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Visa Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
  </head>
  <body>

    <nav class="navbar">
      <div class="navbar-inner">
        <span class="navbar-brand">Gaurav G Alva</span>
        <div class="navbar-links">
          <a href="https://gauravgalva.in" target="_blank" rel="noopener noreferrer">Portfolio</a>
          <a href="https://gauravgalva.in" target="_blank" rel="noopener noreferrer">Contact</a>
        </div>
      </div>
    </nav>

    <section class="page">
      <div class="card">
        <form action="/" method="post">
          <legend class="form-title">US Visa Prediction Form</legend>

          <div class="form-grid">

            <div class="field">
              <label for="continent">Continent</label>
              <select class="form-control" id="continent" name="continent" required>
                <option value="" disabled selected>Select Continent</option>
                <option>Asia</option>
                <option>Africa</option>
                <option>North America</option>
                <option>Europe</option>
                <option>South America</option>
                <option>Oceania</option>
              </select>
            </div>

            <div class="field">
              <label for="education_of_employee">Education of Employee</label>
              <select class="form-control" id="education_of_employee" name="education_of_employee" required>
                <option value="" disabled selected>Select Education</option>
                <option>High School</option>
                <option>Master's</option>
                <option>Bachelor's</option>
                <option>Doctorate</option>
              </select>
            </div>

            <div class="field">
              <label for="has_job_experience">Has Job Experience</label>
              <select class="form-control" id="has_job_experience" name="has_job_experience" required>
                <option value="" disabled selected>Has Experience</option>
                <option value="N">No</option>
                <option value="Y">Yes</option>
              </select>
            </div>

            <div class="field">
              <label for="requires_job_training">Requires Job Training</label>
              <select class="form-control" id="requires_job_training" name="requires_job_training" required>
                <option value="" disabled selected>Required Training</option>
                <option value="N">No</option>
                <option value="Y">Yes</option>
              </select>
            </div>

            <div class="field">
              <label for="no_of_employees">Number of Employees</label>
              <input type="number" class="form-control" id="no_of_employees" name="no_of_employees" min="14500" max="40000" placeholder="Between 15000 - 40000" required>
            </div>

            <div class="field">
              <label for="region_of_employment">Region</label>
              <select class="form-control" id="region_of_employment" name="region_of_employment" required>
                <option value="" disabled selected>Select Region</option>
                <option>West</option>
                <option>Northeast</option>
                <option>South</option>
                <option>Midwest</option>
                <option>Island</option>
              </select>
            </div>

            <div class="field">
              <label for="prevailing_wage">Prevailing Wage</label>
              <input type="number" class="form-control" id="prevailing_wage" name="prevailing_wage" min="600" max="70000" placeholder="Between 700 - 7000" required>
            </div>

            <div class="field">
              <label for="unit_of_wage">Contract Tenure</label>
              <select class="form-control" id="unit_of_wage" name="unit_of_wage" required>
                <option value="" disabled selected>Contract Tenure</option>
                <option>Hour</option>
                <option>Year</option>
                <option>Week</option>
                <option>Month</option>
              </select>
            </div>

            <div class="field">
              <label for="full_time_position">Full Time</label>
              <select class="form-control" id="full_time_position" name="full_time_position" required>
                <option value="" disabled selected>Choose</option>
                <option value="Y">Yes</option>
                <option value="N">No</option>
              </select>
            </div>

            <div class="field">
              <label for="company_age">Age of the Company</label>
              <input type="number" class="form-control" id="company_age" name="company_age" min="15" max="180" placeholder="Between 10 - 180" required>
            </div>

          </div>

          <div class="submit-row">
            <input class="btn-primary" type="submit" value="Predict Visa-Status">
          </div>
        </form>

        {% if context and context != "Rendering" %}
        <div class="result-box">
          <h2>Visa Prediction Status: <span class="result-highlight">{{context}}</span></h2>
        </div>
        {% endif %}
      </div>
    </section>

    <footer class="footer">
      <div class="footer-inner">
        <p>&copy; <span id="year"></span> Gaurav G Alva. All rights reserved.</p>
        <a href="https://gauravgalva.in" target="_blank" rel="noopener noreferrer">gauravgalva.in</a>
      </div>
    </footer>

    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
